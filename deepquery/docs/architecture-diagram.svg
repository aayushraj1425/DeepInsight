<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">DeepQuery Architecture Diagram</title>
  <desc id="desc">Architecture diagram showing the DeepQuery frontend, FastAPI backend, LangGraph agent pipeline, source connectors, OpenAI calls, cached demo path, and streamed outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#E25A3D" />
    </marker>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151" />
    </marker>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#E25A3D" flood-opacity="0.12" />
    </filter>
    <style>
      .bg { fill: #FDFDFD; }
      .panel { fill: #FFFFFF; stroke: #F3D5CC; stroke-width: 2; filter: url(#shadow); }
      .soft { fill: url(#accent); stroke: #F3D5CC; stroke-width: 2; }
      .node { fill: #FFFFFF; stroke: #E5E7EB; stroke-width: 2; }
      .agent { fill: #FFF7ED; stroke: #F3D5CC; stroke-width: 2; }
      .output { fill: #F9FAFB; stroke: #E5E7EB; stroke-width: 2; }
      .title { font: 700 40px Inter, Arial, sans-serif; fill: #1A1A1A; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #6B7280; }
      .section { font: 700 18px Inter, Arial, sans-serif; fill: #1A1A1A; letter-spacing: .4px; }
      .label { font: 700 18px Inter, Arial, sans-serif; fill: #1A1A1A; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #6B7280; }
      .tiny { font: 500 12px Inter, Arial, sans-serif; fill: #6B7280; }
      .accent-text { fill: #E25A3D; font-weight: 700; }
      .line { fill: none; stroke: #E25A3D; stroke-width: 3; marker-end: url(#arrow); }
      .line-dark { fill: none; stroke: #374151; stroke-width: 2.4; marker-end: url(#arrow-dark); }
      .line-soft { fill: none; stroke: #FCA89A; stroke-width: 2.2; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1050" />

  <text x="80" y="78" class="title">DeepQuery Architecture</text>
  <text x="80" y="112" class="subtitle">Multi-agent research workspace: question to evidence, analysis, critique, charts, and decision-ready synthesis.</text>

  <!-- Frontend -->
  <rect x="80" y="170" width="300" height="520" rx="20" class="panel" />
  <text x="110" y="215" class="section">Frontend</text>
  <text x="110" y="244" class="small">React + TypeScript + Vite</text>

  <rect x="112" y="280" width="236" height="78" rx="14" class="soft" />
  <text x="136" y="314" class="label">Home Screen</text>
  <text x="136" y="339" class="small">Query input + uploads</text>

  <rect x="112" y="382" width="236" height="78" rx="14" class="node" />
  <text x="136" y="416" class="label">Results Workspace</text>
  <text x="136" y="441" class="small">Executive summary + charts</text>

  <rect x="112" y="484" width="236" height="78" rx="14" class="node" />
  <text x="136" y="518" class="label">Agent Timeline</text>
  <text x="136" y="543" class="small">Live SSE progress</text>

  <rect x="112" y="586" width="236" height="78" rx="14" class="node" />
  <text x="136" y="620" class="label">Source Peek</text>
  <text x="136" y="645" class="small">Chart point to quote trace</text>

  <!-- Backend -->
  <rect x="470" y="170" width="300" height="520" rx="20" class="panel" />
  <text x="500" y="215" class="section">Backend API</text>
  <text x="500" y="244" class="small">FastAPI + in-memory sessions</text>

  <rect x="502" y="282" width="236" height="72" rx="14" class="soft" />
  <text x="526" y="314" class="label">POST /investigations</text>
  <text x="526" y="338" class="small">Create session + start run</text>

  <rect x="502" y="380" width="236" height="72" rx="14" class="node" />
  <text x="526" y="412" class="label">GET /stream/:id</text>
  <text x="526" y="436" class="small">Server-Sent Events</text>

  <rect x="502" y="478" width="236" height="72" rx="14" class="node" />
  <text x="526" y="510" class="label">POST /upload</text>
  <text x="526" y="534" class="small">PDF, CSV, text parsing</text>

  <rect x="502" y="576" width="236" height="72" rx="14" class="node" />
  <text x="526" y="608" class="label">Cached Demo Path</text>
  <text x="526" y="632" class="small">Fast hackathon runs</text>

  <!-- Agent graph -->
  <rect x="860" y="145" width="660" height="615" rx="22" class="panel" />
  <text x="895" y="190" class="section">LangGraph Agent Pipeline</text>
  <text x="895" y="219" class="small">Critic can route back to discovery or analyst before final output.</text>

  <rect x="910" y="270" width="150" height="74" rx="14" class="agent" />
  <text x="946" y="304" class="label">Planner</text>
  <text x="937" y="328" class="tiny">Subqueries</text>

  <rect x="1110" y="270" width="150" height="74" rx="14" class="agent" />
  <text x="1139" y="304" class="label">Discovery</text>
  <text x="1136" y="328" class="tiny">Find sources</text>

  <rect x="1310" y="270" width="150" height="74" rx="14" class="agent" />
  <text x="1340" y="304" class="label">Extractor</text>
  <text x="1334" y="328" class="tiny">Quotes + data</text>

  <rect x="910" y="430" width="150" height="74" rx="14" class="agent" />
  <text x="950" y="464" class="label">Analyst</text>
  <text x="936" y="488" class="tiny">Stats tools</text>

  <rect x="1110" y="430" width="150" height="74" rx="14" class="agent" />
  <text x="1149" y="464" class="label">Critic</text>
  <text x="1138" y="488" class="tiny">Quality gate</text>

  <rect x="1310" y="430" width="150" height="74" rx="14" class="agent" />
  <text x="1333" y="464" class="label">Visualizer</text>
  <text x="1332" y="488" class="tiny">Chart specs</text>

  <rect x="1110" y="590" width="150" height="74" rx="14" class="agent" />
  <text x="1144" y="624" class="label">Reporter</text>
  <text x="1126" y="648" class="tiny">Synthesis + report</text>

  <!-- Pipeline arrows -->
  <path class="line" d="M1060 307 L1110 307" />
  <path class="line" d="M1260 307 L1310 307" />
  <path class="line" d="M1385 344 C1385 386 1035 385 1035 430" />
  <path class="line" d="M1060 467 L1110 467" />
  <path class="line" d="M1260 467 L1310 467" />
  <path class="line" d="M1385 504 C1385 560 1260 560 1260 627" />
  <path class="line-soft" d="M1185 430 C1185 385 1000 385 985 430" />
  <path class="line-soft" d="M1185 430 C1185 365 1185 365 1185 344" />
  <text x="1010" y="394" class="tiny accent-text">retry analysis</text>
  <text x="1200" y="382" class="tiny accent-text">retry sources</text>

  <!-- External systems -->
  <rect x="860" y="815" width="660" height="155" rx="22" class="panel" />
  <text x="895" y="860" class="section">External Data + AI Services</text>

  <rect x="895" y="890" width="170" height="52" rx="12" class="output" />
  <text x="917" y="922" class="small">Semantic Scholar</text>
  <rect x="1085" y="890" width="120" height="52" rx="12" class="output" />
  <text x="1118" y="922" class="small">PubMed</text>
  <rect x="1225" y="890" width="105" height="52" rx="12" class="output" />
  <text x="1257" y="922" class="small">arXiv</text>
  <rect x="1350" y="890" width="125" height="52" rx="12" class="output" />
  <text x="1380" y="922" class="small">OpenAlex</text>

  <rect x="895" y="790" width="250" height="58" rx="14" class="soft" />
  <text x="922" y="825" class="label">OpenAI + Instructor</text>
  <rect x="1210" y="790" width="265" height="58" rx="14" class="soft" />
  <text x="1232" y="825" class="label">Uploaded Files</text>

  <!-- Outputs -->
  <rect x="470" y="760" width="300" height="210" rx="20" class="panel" />
  <text x="500" y="805" class="section">Streamed Outputs</text>
  <rect x="502" y="832" width="236" height="40" rx="10" class="output" />
  <text x="525" y="858" class="small">sources_ready</text>
  <rect x="502" y="882" width="236" height="40" rx="10" class="output" />
  <text x="525" y="908" class="small">chart_ready</text>
  <rect x="502" y="932" width="236" height="40" rx="10" class="output" />
  <text x="525" y="958" class="small">synthesis_ready / report_ready</text>

  <!-- Cross-system arrows -->
  <path class="line" d="M380 320 L502 320" />
  <text x="398" y="302" class="tiny">query + files</text>

  <path class="line" d="M738 318 C790 318 815 307 910 307" />
  <text x="760" y="292" class="tiny">start graph</text>

  <path class="line-dark" d="M1110 344 C1085 706 1008 730 1008 790" />
  <text x="962" y="752" class="tiny">LLM planning/extraction/reporting</text>

  <path class="line-dark" d="M1185 344 C1185 760 1185 805 1185 890" />
  <text x="1198" y="758" class="tiny">research APIs</text>

  <path class="line-dark" d="M1338 790 C1290 720 1390 650 1385 504" />
  <text x="1365" y="742" class="tiny">uploaded context</text>

  <path class="line" d="M1110 627 C955 725 850 865 770 865" />
  <path class="line" d="M502 415 C425 415 430 523 348 523" />
  <text x="378" y="506" class="tiny">SSE events</text>

  <path class="line-soft" d="M620 576 C715 650 820 720 910 590" />
  <text x="690" y="690" class="tiny accent-text">cached demo bypasses live calls</text>

  <!-- Legend -->
  <rect x="80" y="760" width="300" height="210" rx="20" class="panel" />
  <text x="110" y="805" class="section">Legend</text>
  <rect x="112" y="832" width="22" height="22" rx="5" class="soft" />
  <text x="148" y="849" class="small">Primary product surface or key service</text>
  <rect x="112" y="870" width="22" height="22" rx="5" class="agent" />
  <text x="148" y="887" class="small">Agent node</text>
  <line x1="112" y1="920" x2="148" y2="920" class="line" />
  <text x="162" y="925" class="small">Main execution flow</text>
  <line x1="112" y1="952" x2="148" y2="952" class="line-soft" />
  <text x="162" y="957" class="small">Retry or cached shortcut</text>
</svg>
